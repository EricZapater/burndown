# .github/workflows/deploy-backend.yml (al repositori del backend)
name: Deploy Backend to VPS

on:
  push:
    branches: [main, master]
    paths:
      - "api/**" # Only trigger when api changes
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ericzapater/burndown-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./api # Set context to the api directory
          file: ./api/Dockerfile # Point to the Dockerfile in api directory
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          #cache-from: type=gha
          #cache-to: type=gha,mode=max

      - name: Deploy Backend to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/burndown

            # Login al registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull nova imatge del backend
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Reiniciar només el backend
            docker-compose stop burndown-api
            docker-compose rm -f burndown-api
            docker-compose up -d burndown-api

            # Neteja imatges antigues
            docker image prune -f

            echo "✅ Backend desplegat!"

      - name: Verify backend deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/burndown
            docker-compose ps burndown-api
            echo "🔗 API disponible a: https://api.burndown.zenith.ovh/"
